<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Schovival</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--butter:#FFED9E;--twilight:#426BC2;--leaves:#4A9166;--sky:#A6CFF2;--blossom:#F2C0CA;--forest:#124224;--cloud:#F7F2E8;--apple:#A6BA1A;--sw:236px}
*{box-sizing:border-box;margin:0}
body{font-family:Nunito,system-ui,sans-serif;background:var(--cloud);color:var(--forest);min-height:100vh;font-size:15px}
h1,h2,h3,.stat,.cb b,.pt,.nv,.btn,.chip{font-family:Fredoka,Nunito,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0}
:focus-visible{outline:3px solid var(--twilight);outline-offset:2px}
.hide{display:none!important}
.mas{width:100px;flex:none;filter:drop-shadow(0 6px 0 rgba(18,66,36,.12))}
@keyframes bob{50%{transform:translateY(-8px) rotate(2deg)}}
@keyframes fin{from{opacity:0;transform:translateY(8px)}}
@keyframes pulse{50%{transform:scale(1.045)}}
@keyframes breathe{50%{transform:scale(1.35);opacity:.5}}
.bob{animation:bob 3.6s ease-in-out infinite}
.card{background:#fff;border-radius:26px;padding:20px;box-shadow:0 8px 24px rgba(66,107,194,.1);margin-top:16px;animation:fin .5s both}
.btn{background:var(--twilight);color:#fff;border-radius:16px;padding:10px 20px;font-weight:600;font-size:15px;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 5px 0 rgba(18,66,36,.15)}
.btn:active{transform:scale(.96)}
.btn.run{animation:pulse 1.4s ease-in-out infinite;background:var(--apple);color:var(--forest)}
.btn.b{background:var(--butter);color:var(--forest)}.btn.s{background:var(--sky);color:var(--forest)}.btn.p{background:var(--blossom);color:var(--forest)}.btn.sm{padding:6px 14px;font-size:13px}
.btn[disabled]{opacity:.55;pointer-events:none}
input,select,textarea{width:100%;background:var(--cloud);border:2px solid transparent;border-radius:14px;padding:10px 14px}
input:focus,select:focus,textarea:focus{border-color:var(--twilight);outline:0}
label{font-weight:700;font-size:13px;display:block;margin:12px 0 4px}
h2{font-size:24px;margin-bottom:4px}h3{font-size:17px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center}.wrap{flex-wrap:wrap}
.muted{opacity:.65;font-size:13px}
.cols{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}.cols .card{margin-top:16px}
.chip{border-radius:99px;padding:8px 16px;font-weight:600;background:var(--cloud);color:var(--forest)}.chip.on{background:var(--twilight);color:#fff}

#onb{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 15% 10%,var(--butter) 0,transparent 40%),radial-gradient(circle at 90% 90%,var(--blossom) 0,transparent 40%),var(--sky)}
#onb .box{max-width:420px;width:100%;text-align:center;background:var(--cloud);border-radius:34px;padding:24px 26px 28px;box-shadow:0 20px 50px rgba(18,66,36,.18)}
#onb img{width:210px;display:block;margin:0 auto}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{background:#fff;border-radius:14px;padding:10px;font-weight:700;border:2px solid transparent;font-family:Fredoka}
.seg button.on{background:var(--butter);border-color:var(--forest)}
#onb .btn{width:100%;margin-top:20px;padding:14px;font-size:17px}

#app{display:flex;min-height:100vh}
aside{width:var(--sw);background:var(--twilight);color:#fff;padding:18px 12px;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;gap:6px;transition:width .3s;z-index:20;overflow:hidden}
#app.col{--sw:80px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-left:4px;white-space:nowrap}
.brand img{width:48px;background:var(--butter);border-radius:16px;padding:2px;flex:none}
.brand b{font-size:21px;color:var(--butter)}
.nv{background:transparent;color:#fff;text-align:left;padding:11px 14px;border-radius:16px;font-weight:500;font-size:16px;display:flex;gap:12px;align-items:center;white-space:nowrap;transition:background .2s}
.nv:hover{background:rgba(255,255,255,.16)}.nv.on{background:var(--butter);color:var(--forest);font-weight:600}
.ic{font-size:20px;width:24px;text-align:center;flex:none}
.lb{transition:opacity .2s}#app.col .lb{opacity:0;pointer-events:none}
.foot{margin-top:auto;font-size:12px;opacity:.85;padding:8px 6px;white-space:nowrap}.foot button{background:none;color:var(--blossom);text-decoration:underline;padding:0;margin-top:4px}
#app.col .foot{display:none}
.tg{background:rgba(255,255,255,.18);color:#fff;border-radius:14px;padding:8px;transition:transform .3s}#app.col .tg{transform:rotate(180deg);margin-top:auto}
main{margin-left:var(--sw);flex:1;padding:24px 28px;max-width:1080px;transition:margin-left .3s}
.hero{background:var(--butter);border-radius:30px;padding:20px 24px;display:flex;gap:18px;align-items:center;position:relative;overflow:hidden;min-height:150px;animation:fin .5s both}
.hero .mas{width:118px;position:relative;z-index:1}.hero div{position:relative;z-index:1}
.hero h1{font-size:28px;line-height:1.15}
.hero::before,.hero::after{content:"";position:absolute;bottom:0;right:0}
.hero::before{width:300px;height:120px;background:var(--sky);clip-path:polygon(0 100%,38% 18%,58% 58%,80% 0,100% 100%)}
.hero::after{width:200px;height:70px;background:var(--twilight);opacity:.85;clip-path:polygon(0 100%,45% 25%,100% 100%)}
.streak{background:var(--blossom)}
.stat{font-size:56px;font-weight:700;line-height:1}.stat small{font-size:18px}
.dots{display:flex;gap:6px;margin:12px 0}.dots i{width:26px;height:26px;border-radius:50%;background:rgba(18,66,36,.12);display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700}.dots i.on{background:var(--apple)}
.quote{background:var(--sky);display:flex;flex-direction:column}
.qt{font-size:19px;font-weight:700;line-height:1.5;margin-bottom:12px;transition:opacity .45s;min-height:86px;animation:fin .6s both}
.cdc{background:var(--forest);color:var(--cloud)}
.cbs{display:flex;gap:10px;margin:6px 0 14px}.cb{flex:1;max-width:96px;background:var(--butter);color:var(--forest);border-radius:18px;padding:10px 4px;text-align:center}.cb b{font-size:30px;display:block;line-height:1.1}.cb small{font-size:11px;font-weight:700}
.cdc input{background:rgba(255,255,255,.12);color:#fff}.cdc input::placeholder{color:rgba(255,255,255,.55)}
.item{display:flex;align-items:center;gap:10px;background:var(--cloud);border-radius:16px;padding:10px 12px;margin-top:8px}
.cdc .item{background:rgba(255,255,255,.1)}
.item .t{flex:1;min-width:0;overflow-wrap:anywhere;background:linear-gradient(currentColor,currentColor) no-repeat 0 55%/0 2px;transition:background-size .45s,opacity .45s}
.item.done .t{background-size:100% 2px;opacity:.5}
.x{background:transparent;font-size:18px;color:inherit;opacity:.5;padding:2px 8px}.x:hover{opacity:1}
.cd{min-width:64px;text-align:center;background:var(--sky);color:var(--forest);border-radius:12px;padding:4px 8px;font-weight:700;line-height:1.2}.cd.late{background:var(--blossom)}.cd small{display:block;font-weight:600;font-size:10px}
.note{background:var(--butter);border-radius:18px;padding:12px 14px;margin-top:10px}.note:nth-child(even){background:var(--sky)}
.note b{display:block}.note p{white-space:pre-wrap;overflow-wrap:anywhere;margin:4px 0 8px}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--apple);flex:none}
.cf{position:fixed;pointer-events:none;z-index:99;font-size:18px;font-weight:700}
.ring{position:relative;width:min(260px,100%);margin:14px auto}.ring.pulse{animation:pulse 1.6s ease-in-out infinite}
.ring svg{transform:rotate(-90deg);display:block;width:100%}
.ring .time{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.pt{font-size:56px;font-weight:700;line-height:1}.pl{font-size:13px;font-weight:700;opacity:.7;margin-top:4px}
#fo{position:fixed;inset:0;z-index:60;background:linear-gradient(160deg,var(--twilight),#2c4a94 60%,var(--forest));color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px}
#fo .ring{width:min(330px,80vw)}#fo .pr{stroke:var(--butter)!important}#fo .trk{stroke:rgba(255,255,255,.2)}#fo .pt{font-size:68px}
#fo .halo{position:absolute;width:min(330px,80vw);aspect-ratio:1;border-radius:50%;background:var(--sky);opacity:.25;animation:breathe 8s ease-in-out infinite}
#fo .mas{width:96px;position:relative}
.sc{border-radius:24px;padding:18px;cursor:pointer;position:relative;transition:transform .25s,box-shadow .25s;min-height:112px;margin-top:0!important;border:3px solid transparent}
.sc:hover{transform:translateY(-9px) rotate(-1.2deg);box-shadow:0 18px 30px rgba(18,66,36,.2)}
.sc.sel{border-color:var(--forest)}
.sc h3{margin:0 0 4px}.sc .x{position:absolute;top:8px;right:8px}
.sw{display:flex;gap:8px;margin-top:8px}.sw button{width:32px;height:32px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px rgba(18,66,36,.15)}.sw button.on{box-shadow:0 0 0 3px var(--forest)}
.calc{display:grid;grid-template-columns:1fr 1fr;gap:10px}.calc label{margin-top:6px}
.cr{text-align:center}.cr .ring{width:min(230px,100%)}.big{font-family:Fredoka;font-size:48px;font-weight:700;line-height:1}
.res{background:var(--cloud);border-radius:16px;padding:14px;margin-top:12px;font-weight:700;line-height:1.5}
#fab{position:fixed;right:20px;bottom:20px;width:56px;height:56px;border-radius:50%;background:var(--apple);font-size:24px;box-shadow:0 8px 20px rgba(18,66,36,.25);z-index:30;transition:transform .2s}#fab:hover{transform:scale(1.1) rotate(-8deg)}
#dr{position:fixed;top:0;right:0;bottom:0;width:min(380px,100%);background:#fff;z-index:50;padding:22px;transform:translateX(105%);transition:transform .35s;box-shadow:-10px 0 30px rgba(18,66,36,.2)}#dr.on{transform:none}
#bd{position:fixed;inset:0;background:rgba(18,66,36,.35);z-index:40;opacity:0;pointer-events:none;transition:opacity .3s}#bd.on{opacity:1;pointer-events:auto}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--forest);color:var(--butter);padding:12px 20px;border-radius:99px;z-index:99;font-weight:700;animation:fin .3s both;max-width:90vw;text-align:center}
#pet{position:fixed;right:88px;bottom:12px;z-index:35;width:96px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
#pet .pw{animation:bob 3.6s ease-in-out infinite}
#pet img{width:100%;display:block;filter:drop-shadow(0 6px 0 rgba(18,66,36,.15));transition:transform .15s ease-out;transform:translate(var(--dx,0px),var(--dy,0px)) rotate(var(--rt,0deg))}
#pet:hover .pw{animation:wig .5s ease-in-out infinite}
@keyframes wig{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes jump{40%{transform:translateY(-36px) scale(1.08,.94)}}
#pet.jump{animation:jump .6s cubic-bezier(.3,1.6,.5,1)}
.bubble{position:absolute;right:70px;bottom:78px;background:#fff;border:2px solid var(--forest);border-radius:16px 16px 4px 16px;padding:8px 12px;font-weight:700;font-size:13px;width:max-content;max-width:210px;opacity:0;transform:scale(.8);transform-origin:bottom right;transition:.25s;pointer-events:none;box-shadow:0 6px 16px rgba(18,66,36,.15)}
.bubble.on{opacity:1;transform:none}
.bar{height:10px;background:var(--cloud);border-radius:99px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--apple);border-radius:99px;transition:width .5s}
.chat{display:flex;flex-direction:column;gap:10px;max-height:52vh;min-height:200px;overflow-y:auto;padding:4px}
.msg{max-width:85%;padding:10px 14px;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5;animation:fin .3s both}
.msg.u{align-self:flex-end;background:var(--twilight);color:#fff;border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--butter);border-bottom-left-radius:4px}
nav.bot{display:none}
@media(max-width:760px){
 aside{display:none}main{margin:0;padding:16px 14px 100px}
 nav.bot{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:3px solid var(--butter);justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:30}
 nav.bot button{background:none;display:flex;flex-direction:column;align-items:center;font-size:11px;gap:2px;padding:6px 10px;border-radius:14px;color:var(--forest);opacity:.65;font-weight:700}nav.bot button span{font-size:20px}nav.bot button.on{background:var(--butter);opacity:1}
 #fab{bottom:84px;right:14px}#pet{right:auto;left:8px;bottom:78px;width:76px}.bubble{right:auto;left:62px;bottom:62px;border-radius:16px 16px 16px 4px;transform-origin:bottom left;max-width:190px}.hero h1{font-size:21px}.hero .mas{width:84px}.stat{font-size:48px}.cb b{font-size:24px}
}
.dayc{display:flex;flex-wrap:wrap;gap:6px}.dayc .chip{padding:6px 13px;font-size:14px;border:2px solid transparent}.dayc .chip.on{border-color:var(--forest)}
.tm{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wk{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-top:12px}
.dc{background:var(--cloud);border-radius:20px;padding:12px;min-height:90px}.dc.now{background:var(--butter);outline:3px solid var(--forest)}
.dc h4{font-family:Fredoka;font-size:16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.dc h4 small{font-size:11px;background:var(--forest);color:var(--butter);border-radius:99px;padding:2px 8px}
.si{border-radius:14px;padding:8px 10px;margin-top:6px;position:relative;padding-right:30px;line-height:1.3}.si b{display:block;font-family:Fredoka;font-weight:600}.si span{font-size:12px;font-weight:700;opacity:.85}.si .x{position:absolute;top:4px;right:2px;font-size:15px}
.bd2{display:inline-block;font-size:11px;font-weight:700;background:rgba(255,255,255,.55);color:var(--forest);border-radius:99px;padding:2px 8px;margin:2px 3px 0 0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<section id="onb" class="hide"><div class="box">
 <img id="lg" alt="Logo Schovival" class="bob">
 <p class="muted">Teman belajar petualanganmu</p>
 <label for="nm" style="text-align:left">Nama panggilan</label><input id="nm" maxlength="24" placeholder="Contoh: Jhony" autocomplete="off">
 <label style="text-align:left">Kelas</label><div class="seg" id="segK"><button data-v="X">X</button><button data-v="XI">XI</button><button data-v="XII">XII</button></div>
 <label style="text-align:left">Jurusan</label><div class="seg" id="segJ"><button data-v="IPA">IPA</button><button data-v="IPS">IPS</button><button data-v="Bahasa">Bahasa</button></div>
 <p id="err" class="muted" style="color:#b3261e;margin-top:10px"></p>
 <button class="btn" id="go">Mulai petualangan</button>
</div></section>

<div id="app" class="hide">
 <aside id="side"></aside><main id="main"></main><nav class="bot" id="bot"></nav>
 <button id="fab" onclick="openQ()" aria-label="Catatan cepat">✏️</button>
</div>

<div id="pet" class="hide" onclick="petClick()" role="button" aria-label="Maskot Schovival, ketuk untuk disapa"><div class="bubble" id="pbub"></div><div class="pw"><img id="pi" alt=""></div></div>
<div id="bd" onclick="closeQ()"></div>
<div id="dr" role="dialog" aria-label="Catatan cepat">
 <h3>✏️ Catatan cepat</h3><input id="qn" placeholder="Judul (boleh kosong)"><textarea id="qb" rows="7" placeholder="Tulis ide, rumus, atau pengingat…" style="margin-top:8px;resize:vertical"></textarea>
 <div class="row" style="margin-top:10px"><button class="btn" onclick="saveQ()">Simpan</button><button class="btn s" onclick="closeQ()">Tutup</button></div>
 <p class="muted" style="margin-top:12px">Catatan tersimpan di menu Tugas.</p>
</div>

<div id="fo" class="hide">
 <div class="halo"></div><img class="mas bob" id="fm" alt="">
 <div class="ring"><svg viewBox="0 0 240 240"><circle class="trk" cx="120" cy="120" r="108" fill="none" stroke-width="12"/><circle class="pr" cx="120" cy="120" r="108" fill="none" stroke-width="12" stroke-linecap="round" stroke-dasharray="678.6"/></svg><div class="time"><div><div class="pt">25:00</div><div class="pl"></div></div></div></div>
 <p style="opacity:.8;position:relative">Tarik napas pelan, hembuskan, lalu fokus.</p>
 <div class="row" style="position:relative"><button class="btn b pb" onclick="togPomo()">▶ Mulai</button><button class="btn s" onclick="resetPomo()">Ulang</button><button class="btn p" onclick="closeFocus()">Keluar</button></div>
</div>

 for(let i=0;i<16;i++){const e=document.createElement('span');e.className='cf';e.textContent=sh[i%5];e.style.cssText=`left:${x}px;top:${y}px;color:${cs[i%6]}`;document.body.appendChild(e);
 const a=Math.PI*2*i/16+Math.random()*.4,d=50+Math.random()*60,cx=Math.cos(a)*d,cy=Math.sin(a)*d;
 e.animate([{transform:'translate(-50%,-50%) scale(.3)',opacity:1},{transform:`translate(calc(-50% + ${cx}px),calc(-50% + ${cy-30}px)) rotate(${Math.random()*360}deg) scale(1.1)`,opacity:1,offset:.55},{transform:`translate(calc(-50% + ${cx}px),calc(-50% + ${cy+45}px)) scale(.6)`,opacity:0}],{duration:950,easing:'ease-out'}).onfinish=()=>e.remove()}}
function countUp(el,to){if(!el)return;const t0=performance.now();(function f(n){const p=Math.min((n-t0)/1000,1);el.textContent=Math.round(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t0)}

/* streak */
function checkStreak(){const s=S.streak;if(s.last&&dayDiff(s.last,today())>1){s.count=0;save()}}
function checkin(){const s=S.streak,t=today();if(s.last===t)return;s.count=(s.last&&dayDiff(s.last,t)===1)?s.count+1:1;s.last=t;s.days=(s.days||[]).concat(t).slice(-14);save();if(view==='home')render();toast('🔥 Streak jadi '+s.count+' hari!');petSay('Streak naik jadi '+s.count+'! 🔥','action')}

seg('segK',v=>selK=v);seg('segJ',v=>selJ=v);

/* beranda */

 const s=S.streak,done=s.last===today(),dys=[];
 for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);dys.push(`<i class="${(s.days||[]).includes(d.toLocaleDateString('en-CA'))?'on':''}">${['M','S','S','R','K','J','S'][d.getDay()]}</i>`)}
 const h=new Date().getHours(),g=h<11?'Selamat pagi':h<15?'Selamat siang':h<18?'Selamat sore':'Selamat malam',open=S.tasks.filter(x=>!x.done).length;
 return `<div class="hero"><img class="mas bob" src="${MAS}" alt="Maskot Schovival"><div><h1>${g}, ${esc(S.user.name)}!</h1><p>Kelas ${S.user.kelas} ${S.user.jur} · ${open} tugas belum selesai · ${S.pomo} sesi fokus</p></div></div>
 <div class="cols">
  <div class="card streak"><h3>🔥 Streak belajar</h3><div class="stat"><span id="sn">0</span> <small>hari</small></div><div class="dots">${dys.join('')}</div><button class="btn" ${done?'disabled':''} onclick="checkin()">${done?'Sudah check-in hari ini ✓':'Aku belajar hari ini'}</button></div>
  <div class="card quote"><h3>💬 Motivasi harian</h3><p class="qt" id="qt">“${QUOTES[qi]}”</p><div><button class="btn sm b" onclick="rotQ()">Motivasi lain</button></div></div>
 </div>
 <div class="card cdc"><h3>⏳ Countdown deadline</h3><div id="cdb">${cdBig()}</div>
  <div class="row wrap"><input id="dt" placeholder="Nama deadline (mis. Ulangan Fisika)" style="flex:2;min-width:170px"><input id="dd" type="datetime-local" style="flex:1;min-width:180px"><button class="btn b" onclick="addDl()">Tambah</button></div><div id="dls">${dlHtml()}</div></div>`;

function rotQ(){const e=$('#qt');if(!e)return;e.style.opacity=0;setTimeout(()=>{qi=(qi+1)%QUOTES.length;const n=$('#qt');if(n){n.textContent='“'+QUOTES[qi]+'”';n.style.opacity=1}},450)}
setInterval(rotQ,7000);
function cdBig(){const up=[...S.dl].filter(d=>new Date(d.at)>new Date()).sort((a,b)=>a.at.localeCompare(b.at))[0];
 if(!up)return '<p class="muted" style="color:#fff;margin-bottom:12px">Belum ada deadline mendatang. Tambahkan satu di bawah.</p>';
 const ms=new Date(up.at)-new Date(),p=(n,l)=>`<div class="cb"><b>${String(n).padStart(2,'0')}</b><small>${l}</small></div>`;
 return `<p style="font-weight:700">${esc(up.title)}</p><div class="cbs">${p(Math.floor(ms/864e5),'hari')}${p(Math.floor(ms%864e5/36e5),'jam')}${p(Math.floor(ms%36e5/6e4),'menit')}${p(Math.floor(ms%6e4/1e3),'detik')}</div>`}
function dlHtml(){
 if(!S.dl.length)return '';
 return [...S.dl].sort((a,b)=>a.at.localeCompare(b.at)).map(d=>{const ms=new Date(d.at)-new Date(),late=ms<0,a=Math.abs(ms),dy=Math.floor(a/864e5),hr=Math.floor(a%864e5/36e5),mn=Math.floor(a%36e5/6e4);
  return `<div class="item"><div class="cd ${late?'late':''}">${dy>0?dy+'h '+hr+'j':hr+'j '+mn+'m'}<small>${late?'terlewat':'lagi'}</small></div><div class="t"><b>${esc(d.title)}</b><div class="muted">${new Date(d.at).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'})}</div></div><button class="x" aria-label="Hapus" onclick="delDl(${d.id})">✕</button></div>`}).join('')}
function addDl(){const t=$('#dt').value.trim(),d=$('#dd').value;if(!t||!d)return toast('Isi nama dan waktu deadline dulu ya.');S.dl.push({id:Date.now(),title:t,at:d});save();render()}
function delDl(id){S.dl=S.dl.filter(x=>x.id!==id);save();render()}
setInterval(()=>{const e=$('#cdb');if(e&&view==='home')e.innerHTML=cdBig()},1000);
setInterval(()=>{const e=$('#dls');if(e&&view==='home')e.innerHTML=dlHtml()},30000);

function delNote(id){S.notes=S.notes.filter(x=>x.id!==id);save();render()}

/* pomodoro */
const MODES={fokus:[25,'Fokus'],pendek:[5,'Istirahat'],panjang:[15,'Istirahat panjang']};
let pm='fokus',left=25*60,tm=null;
const subjName=()=>(S.subj.find(s=>s.id===S.sel)||{}).name||'';
const ring=()=>`<div class="ring"><svg viewBox="0 0 240 240"><circle cx="120" cy="120" r="108" fill="none" stroke="#F7F2E8" stroke-width="16"/><circle class="pr" cx="120" cy="120" r="108" fill="none" stroke-width="16" stroke-linecap="round" stroke-dasharray="678.6"/></svg><div class="time"><div><div class="pt">25:00</div><div class="pl"></div></div></div></div>`;
function vPomo(){
 return `<div class="card" style="max-width:460px;margin:16px auto 0;text-align:center"><h2>Pomodoro & fokus</h2><p class="muted">${subjName()?'Belajar untuk: '+esc(subjName()):'Pilih mapel di menu Mapel untuk menandai sesimu.'}</p>
 <div class="row wrap" style="justify-content:center;margin-top:12px">${Object.keys(MODES).map(k=>`<button class="chip ${pm===k?'on':''}" onclick="setMode('${k}')">${MODES[k][1]}</button>`).join('')}</div>
 ${ring()}
 <div class="row wrap" style="justify-content:center"><button class="btn pb" onclick="togPomo()">▶ Mulai</button><button class="btn s" onclick="resetPomo()">Ulang</button><button class="btn b" onclick="openFocus()">Mode fokus layar penuh</button></div>
 <p class="muted" style="margin-top:14px">Sesi fokus selesai: <b>${S.pomo}</b></p></div>`}
function pomoDraw(){const tot=MODES[pm][0]*60,m=String(Math.floor(left/60)).padStart(2,'0'),s=String(left%60).padStart(2,'0');
 $$('.pt').forEach(e=>e.textContent=m+':'+s);
 $$('.pl').forEach(e=>e.textContent=MODES[pm][1]+(pm==='fokus'&&subjName()?' · '+subjName():''));
 $$('.pr').forEach(e=>{e.style.strokeDashoffset=678.6*(1-left/tot);e.style.stroke=pm==='fokus'?'#426BC2':'#A6BA1A'});
 $$('.pb').forEach(e=>{e.textContent=tm?'⏸ Jeda':'▶ Mulai';e.classList.toggle('run',!!tm)});
 $$('.ring').forEach(e=>e.classList.toggle('pulse',!!tm));
 document.title=tm?m+':'+s+' · Schovival':'Schovival'}
function setMode(k){clearInterval(tm);tm=null;pm=k;left=MODES[k][0]*60;if(view==='pomo')render();pomoDraw()}
function resetPomo(){clearInterval(tm);tm=null;left=MODES[pm][0]*60;pomoDraw()}
function togPomo(){if(tm){clearInterval(tm);tm=null;return pomoDraw()}
 tm=setInterval(()=>{left--;if(left<=0){clearInterval(tm);tm=null;beep();if(pm==='fokus'){S.pomo++;save();checkin();toast('Sesi fokus selesai! Istirahat dulu ya.');petSay('Sesi selesai! Minum air dulu 💧','action');setMode('pendek')}else{toast('Istirahat selesai. Siap fokus lagi?');setMode('fokus')}return}pomoDraw()},1000);pomoDraw();petSay('Fokus dimulai! Aku temani ya 🦉','side')}
function openFocus(){$('#fo').classList.remove('hide');try{document.documentElement.requestFullscreen()}catch(e){}pomoDraw()}
function closeFocus(){$('#fo').classList.add('hide');try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){}}
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)$('#fo').classList.add('hide')});
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=660;g.gain.setValueAtTime(.2,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+1);o.start();o.stop(c.currentTime+1)}catch(e){}}

/* mapel */
function vSubj(){
 const sc=S.subj.filter(s=>S.scores[s.name]!=null),avg=sc.length?(sc.reduce((a,s)=>a+S.scores[s.name],0)/sc.length).toFixed(1):null;
 return `<h2>Mata pelajaran</h2><p class="muted">Klik kartu untuk memilih mapel yang sedang kamu pelajari.${avg?' Rata-rata nilai tersimpan: <b>'+avg+'</b>':''}</p>
 <div class="card"><div class="row wrap"><input id="sn2" placeholder="Nama mata pelajaran" style="flex:1;min-width:180px" onkeydown="if(event.key==='Enter')addSubj()"><div class="sw" style="margin:0">${COL.map(c=>`<button style="background:${c}" class="${c===pick?'on':''}" aria-label="Warna ${c}" onclick="pick='${c}';render()"></button>`).join('')}</div><button class="btn" onclick="addSubj()">Tambah</button></div>
 <div class="row wrap" style="margin-top:12px"><span class="muted">Saran ${S.user.jur}:</span>${SUBJ[S.user.jur].filter(n=>!S.subj.some(s=>s.name===n)).map(n=>`<button class="chip" onclick="quickSubj('${n}')">+ ${n}</button>`).join('')||'<span class="muted">semua sudah ditambahkan</span>'}</div></div>
 <div class="cols" style="margin-top:16px">${S.subj.map(s=>`<div class="sc ${S.sel===s.id?'sel':''}" style="background:${s.color};color:${DK.includes(s.color)?'#fff':'#124224'}" onclick="selSubj(${s.id})"><button class="x" aria-label="Hapus" onclick="event.stopPropagation();delSubj(${s.id})">✕</button><h3>${esc(s.name)}</h3>${schedBadges(s.id)}<p>${S.sel===s.id?'✓ Sedang dipelajari':'Ketuk untuk memilih'}</p>${S.scores[s.name]!=null?`<p style="font-weight:700">Nilai: ${S.scores[s.name].toFixed(1)}</p>`:''}</div>`).join('')||'<p class="muted">Belum ada mapel. Tambahkan lewat kolom di atas.</p>'}</div>${vSched()}`}
function addSubj(){const v=$('#sn2').value.trim();if(!v)return;S.subj.push({id:Date.now(),name:v,color:pick});save();render()}
function quickSubj(n){S.subj.push({id:Date.now(),name:n,color:COL[S.subj.length%COL.length]});save();render()}
function delSubj(id){S.subj=S.subj.filter(x=>x.id!==id);S.sched=(S.sched||[]).filter(x=>x.sid!==id);if(S.sel===id)S.sel=null;save();render()}
function selSubj(id){S.sel=S.sel===id?null:id;save();render()}

/* jadwal mapel */
const DAYS=['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'];
let sDays=[];
const toMin=t=>{const[a,b]=t.split(':').map(Number);return a*60+b};
const todayIdx=()=>(new Date().getDay()+6)%7;
function schedBadges(sid){const d=[...new Set((S.sched||[]).filter(x=>x.sid===sid).map(x=>x.day))].sort((a,b)=>a-b);
 return d.length?`<div>${d.map(i=>`<span class="bd2">${DAYS[i].slice(0,3)}</span>`).join('')}</div>`:''}
function vSched(){
 const sc=(S.sched||[]).filter(x=>S.subj.some(s=>s.id===x.sid)),td=todayIdx();
 const form=S.subj.length?`<label for="ss">Mata pelajaran</label><select id="ss">${S.subj.map(s=>`<option value="${s.id}" ${S.sel===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select>
 <label>Hari <span class="muted">(boleh pilih lebih dari satu)</span></label><div class="dayc" id="dayc">${DAYS.map((d,i)=>`<button type="button" class="chip ${sDays.includes(i)?'on':''}" onclick="togDay(${i})">${d}</button>`).join('')}</div>
 <div class="row wrap" style="margin-top:8px"><button type="button" class="btn sm s" onclick="setDays([0,1,2,3,4])">Senin–Jumat</button><button type="button" class="btn sm b" onclick="setDays([0,1,2,3,4,5,6])">Setiap hari</button><button type="button" class="btn sm p" onclick="setDays([])">Kosongkan</button></div>
 <div class="tm"><div><label for="st">Jam mulai</label><input id="st" type="time" value="07:00"></div><div><label for="se">Jam selesai</label><input id="se" type="time" value="08:30"></div></div>
 <label for="sr">Ruang / catatan <span class="muted">(opsional)</span></label><input id="sr" maxlength="40" placeholder="Contoh: Lab IPA, Bu Rina" onkeydown="if(event.key==='Enter')addSched()">
 <button class="btn" style="margin-top:14px" onclick="addSched()">+ Tambah ke jadwal</button>`:'<p class="muted" style="margin-top:8px">Tambahkan mata pelajaran dulu di atas, lalu atur jadwalnya di sini.</p>';
 const week=DAYS.map((d,i)=>{const it=sc.filter(x=>x.day===i).sort((a,b)=>a.start.localeCompare(b.start));
  return `<div class="dc ${i===td?'now':''}"><h4>${d}${i===td?'<small>Hari ini</small>':''}</h4>${it.map(x=>{const s=S.subj.find(y=>y.id===x.sid);
   return `<div class="si" style="background:${s.color};color:${DK.includes(s.color)?'#fff':'#124224'}"><b>${esc(s.name)}</b><span>${x.start}–${x.end}${x.note?' · '+esc(x.note):''}</span><button class="x" aria-label="Hapus jadwal" onclick="delSched(${x.id})">✕</button></div>`}).join('')||'<p class="muted">Kosong</p>'}</div>`}).join('');
 return `<div class="card"><h3>🗓️ Jadwal mapel</h3><p class="muted">Atur kapan tiap mapel berlangsung, dari Senin sampai Minggu.${sc.length?' Total <b>'+sc.length+'</b> sesi per minggu.':''}</p>${form}</div>
 <div class="card"><h3>📅 Jadwal mingguan</h3><div class="wk">${week}</div>${sc.length?'<div style="margin-top:12px"><button class="btn sm p" onclick="clearSched()">Hapus semua jadwal</button></div>':''}</div>`}
function togDay(i){const k=sDays.indexOf(i);k<0?sDays.push(i):sDays.splice(k,1);sDays.sort((a,b)=>a-b);syncDays()}
function setDays(a){sDays=a.slice();syncDays()}
function syncDays(){$$('#dayc .chip').forEach((b,i)=>b.classList.toggle('on',sDays.includes(i)))}
function addSched(){
 const sid=+$('#ss').value,st=$('#st').value,se=$('#se').value,note=$('#sr').value.trim();
 if(!sDays.length)return toast('Pilih minimal satu hari dulu ya.');
 if(!st||!se)return toast('Isi jam mulai dan jam selesai.');
 if(toMin(se)<=toMin(st))return toast('Jam selesai harus setelah jam mulai.');
 S.sched=S.sched||[];
 const clash=[];sDays.forEach(d=>S.sched.forEach(x=>{if(x.day===d&&toMin(st)<toMin(x.end)&&toMin(se)>toMin(x.start)){const s=S.subj.find(y=>y.id===x.sid);if(s)clash.push(DAYS[d]+' '+x.start+'–'+x.end+' ('+s.name+')')}}));
 if(clash.length&&!confirm('Jam ini bentrok dengan:\n'+clash.join('\n')+'\n\nTetap tambahkan?'))return;
 const dup=sDays.filter(d=>S.sched.some(x=>x.sid===sid&&x.day===d&&x.start===st&&x.end===se));
 const add=sDays.filter(d=>!dup.includes(d));
 if(!add.length)return toast('Jadwal itu sudah ada.');
 add.forEach((d,j)=>S.sched.push({id:Date.now()+j,sid,day:d,start:st,end:se,note}));
 const n=add.length;sDays=[];save();render();toast('🗓️ '+n+' jadwal ditambahkan ✓');petSay('Jadwal baru tercatat! 📚','wings')}
function delSched(id){S.sched=(S.sched||[]).filter(x=>x.id!==id);save();render()}
function clearSched(){if(confirm('Hapus semua jadwal mapel?')){S.sched=[];save();render()}}

/* kalkulator */
const MAPEL=['Fisika','Kimia','Biologi','Matematika Lanjut','Geografi','Ekonomi','Sosiologi','Sejarah','Pendidikan Pancasila','Bahasa Indonesia','Bahasa Inggris','Bahasa Inggris Lanjutan','Seni dan Budaya','PJOK','Informatika','Prakarya dan Kewirausahaan','Bahasa Jepang','Bahasa Prancis'];
let calcSub='',hit=false,lastF=0;
function vCalc(){
 const own=S.subj.map(s=>s.name).filter(n=>!MAPEL.includes(n)),cur=calcSub||subjName();
 const opt=n=>`<option ${n===cur?'selected':''}>${esc(n)}</option>`;
 const n=(id,l,v)=>`<div><label for="${id}">${l}</label><input id="${id}" type="number" min="0" max="100" inputmode="decimal" value="${v}" oninput="calcLive()"></div>`;
 return `<h2>Kalkulator nilai & target</h2><div class="cols"><div class="card"><label for="cs">Mata pelajaran</label><select id="cs" onchange="pickSub()"><option value="">Pilih mata pelajaran…</option>${MAPEL.map(opt).join('')}${own.length?`<optgroup label="Mapel tambahanmu">${own.map(opt).join('')}</optgroup>`:''}</select><p class="muted" id="cinfo" style="margin-top:6px"></p>
 <div class="calc">${n('ct','Nilai tugas','')}${n('wt','Bobot tugas (%)',30)}${n('cu','Nilai UTS','')}${n('wu','Bobot UTS (%)',30)}${n('ca','Nilai UAS','')}${n('wa','Bobot UAS (%)',40)}</div>
 ${n('cg','Target nilai akhir',85)}</div>
 <div class="card cr"><h3>Nilai akhir</h3><div class="ring"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="84" fill="none" stroke="#F7F2E8" stroke-width="16"/><circle id="cp" cx="100" cy="100" r="84" fill="none" stroke="#426BC2" stroke-width="16" stroke-linecap="round" stroke-dasharray="527.8" stroke-dashoffset="527.8" transform="rotate(-90 100 100)" style="transition:stroke-dashoffset .6s,stroke .3s"/><g id="tk2" style="transition:transform .4s;transform-origin:100px 100px"><line x1="100" y1="4" x2="100" y2="26" stroke="#124224" stroke-width="4" stroke-linecap="round"/></g></svg><div class="time"><div><div class="big" id="cv">0</div><div class="pl" id="cgd">Predikat -</div></div></div></div>

function scoresHtml(){const e=Object.entries(S.scores);if(!e.length)return '<p class="muted">Belum ada nilai tersimpan. Hitung nilai lalu tekan simpan.</p>';
 const avg=(e.reduce((a,x)=>a+x[1],0)/e.length).toFixed(1);
 return `<p class="muted">Rata-rata ${e.length} mapel: <b>${avg}</b></p>`+e.map(([k,v])=>`<div class="item" style="display:block"><div class="row"><b style="flex:1">${esc(k)}</b><span>${v.toFixed(1)}</span><button class="x" aria-label="Hapus" onclick="delScore('${encodeURIComponent(k)}')">✕</button></div><div class="bar"><i style="width:${v}%"></i></div></div>`).join('')}
function delScore(k){delete S.scores[decodeURIComponent(k)];save();const e=$('#scl');if(e)e.innerHTML=scoresHtml();subInfo()}
function subInfo(){const n=$('#cs')?$('#cs').value:'',e=$('#cinfo');if(!e)return;e.textContent=!n?'':S.scores[n]!=null?'Nilai tersimpan untuk '+n+': '+S.scores[n].toFixed(1):'Belum ada nilai tersimpan untuk '+n+'.'}
function pickSub(){calcSub=$('#cs').value;subInfo();if(calcSub)petSay('Semangat belajar '+calcSub+'! 💪','action')}
function calcLive(){const v=id=>Math.max(0,Math.min(100,parseFloat($(id).value)||0)),T=v('#ct'),U=v('#cu'),A=v('#ca'),G=v('#cg'),a=parseFloat($('#wt').value)||0,b=parseFloat($('#wu').value)||0,c=parseFloat($('#wa').value)||0,W=a+b+c;
 const f=W?(T*a+U*b+A*c)/W:0,has=$('#ca').value!=='';lastF=f;
 $('#cv').textContent=f.toFixed(1);$('#cgd').textContent='Predikat '+(f>=90?'A':f>=80?'B':f>=70?'C':f>=60?'D':'E');
 $('#cp').style.strokeDashoffset=527.8*(1-f/100);$('#cp').style.stroke=f>=G?'#A6BA1A':'#426BC2';$('#tk2').style.transform=`rotate(${G*3.6}deg)`;
 let m;if(!W)m='Isi bobot nilai dulu. Totalnya biasanya 100%.';
 else if(!has){const need=(G*W-T*a-U*b)/c;m=!c?'Bobot UAS masih 0.':need>100?`Target ${G} belum bisa dicapai walau UAS 100. Coba turunkan target atau perbaiki nilai tugas.`:need<=0?`Aman! Target ${G} sudah tercapai bahkan jika UAS 0. Tetap belajar ya.`:`Kamu butuh nilai UAS minimal ${(Math.ceil(need*10)/10)} agar mencapai target ${G}.`}
 else m=f>=G?'🎉 Target tercapai. Pertahankan!':`Masih kurang ${(G-f).toFixed(1)} poin dari target ${G}.`;
 $('#cm').textContent=m;
 const ok=has&&f>=G&&W>0;if(ok&&!hit)petSay('Target tercapai! Hebat banget! 🎉','wings');hit=ok;subInfo()}
function saveScore(){const n=$('#cs').value;if(!n)return toast('Pilih mata pelajaran dulu.');if($('#ca').value==='')return toast('Isi nilai UAS dulu supaya nilai akhirnya lengkap.');
 S.scores[n]=lastF;save();$('#scl').innerHTML=scoresHtml();subInfo();toast('Nilai '+n+' tersimpan ✓');petSay('Nilai '+n+' sudah kusimpan! 📚','action')}

function calcExpr(q){let s=q.toLowerCase().replace(/berapa|hitung|hasil dari|hasil|=|\?/g,' ').replace(/×|x(?=\s*\d)/g,'*').replace(/÷/g,'/').replace(/\^/g,'**').replace(/,/g,'.').trim();
 if(!/^[\d\s+\-*/().%]+$/.test(s)||!/\d/.test(s)||!/[+\-*/%]/.test(s))return null;
 try{const r=Function('"use strict";return ('+s+')')();return Number.isFinite(r)?+r.toFixed(6):null}catch(e){return null}}
function localAnswer(q){
 const m=calcExpr(q);if(m!==null)return 'Hasilnya: '+m+' 🧮';
 let n=norm(q);
 if(/ (daftar topik|topik|bantuan|help|menu) /.test(n))return 'Topik yang bisa kujawab:\n'+KB.map(e=>e[0][0]).join(', ')+'.\n\nKetik salah satunya, ya.';
 const toks=n.trim().split(' ').map(t=>SYN[t]||t).join(' ').split(' ').filter(t=>t&&!STOP.has(t));
 n=norm(toks.join(' ')+' '+q);
 const res=[];
 KB.forEach((e,idx)=>{let sc=0;
  for(const k of e[0]){const kn=norm(k).trim();
   if(n.includes(' '+kn+' ')){sc+=kn.length*2;continue}
   if(kn.includes(' ')||kn.length<4)continue;
   let b=0;for(const t of toks){if(t.length<4)continue;
    if(t.startsWith(kn)||(t.length>=5&&kn.startsWith(t)))b=Math.max(b,kn.length*1.3);
    else{const d=lev(t,kn);if(d<=(kn.length>=9?2:1))b=Math.max(b,kn.length*1.2-d)}}
   sc+=b}
  if(sc>=3)res.push([sc,idx])});
 res.sort((a,b)=>b[0]-a[0]);
 if(!res.length)return 'Hmm, aku belum punya jawaban untuk itu 🦉. Coba tulis kata kunci materinya saja, misalnya: hukum Newton, mol, pH, turunan, inflasi, proklamasi, tenses, atau algoritma. Ketik "daftar topik" untuk melihat semua topik yang kubisa.';
 let out=KB[res[0][1]][1];
 if(res[1]&&res[1][0]>=res[0][0]*.6)out+='\n\nTopik terkait: '+KB[res[1][1]][0][0]+' (coba ketik itu).';
 return out}
function localAsk(q){chat.push({role:'user',content:q});$('#aq').value='';aiBusy=true;aiDraw(true);petSay('Hmm, kucari di catatanku… 🤔','side');
 setTimeout(()=>{chat.push({role:'assistant',content:localAnswer(q)});aiBusy=false;if(view==='ai')aiDraw();petSay('Semoga membantu! 🦉','wings')},600)}

/* tampilan jawaban: markdown dan LaTeX ke teks rapi */
const SUPM={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻','+':'⁺','n':'ⁿ','x':'ˣ'},SUBM={'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉'};
const GRK={mu:'μ',pi:'π',alpha:'α',beta:'β',gamma:'γ',delta:'δ',Delta:'Δ',theta:'θ',lambda:'λ',omega:'ω',Omega:'Ω',rho:'ρ',sigma:'σ',epsilon:'ε',phi:'φ',tau:'τ',eta:'η'};
const mapCh=(t,m)=>[...t].every(c=>m[c])?[...t].map(c=>m[c]).join(''):null;
function tex(s){let r=s;
 for(let i=0;i<4;i++)r=r.replace(/\\frac\s*\{([^{}]*)\}\s*\{([^{}]*)\}/g,(_,a,b)=>'('+a.trim()+') / ('+b.trim()+')');
 r=r.replace(/\\sqrt\s*\{([^{}]*)\}/g,'√($1)').replace(/\\(?:text|mathrm|mathbf)\s*\{([^{}]*)\}/g,'$1')
  .replace(/\\cdot/g,'·').replace(/\\times/g,'×').replace(/\\div/g,'÷').replace(/\\pm/g,'±').replace(/\\approx/g,'≈').replace(/\\leq?\b/g,'≤').replace(/\\geq?\b/g,'≥').replace(/\\neq/g,'≠').replace(/\\rightarrow|\\to\b/g,'→')
  .replace(/\\(?:quad|qquad)|\\[,;!]/g,' ').replace(/\\left|\\right/g,'')
  .replace(/\\([A-Za-z]+)/g,(m,n)=>GRK[n]||n)
  .replace(/\^\{([^{}]*)\}|\^(\w)/g,(m,a,b)=>{const t=a!==undefined?a:b;return mapCh(t,SUPM)||'^('+t+')'})
  .replace(/_\{([^{}]*)\}|_(\w)/g,(m,a,b)=>{const t=a!==undefined?a:b;return mapCh(t,SUBM)||'_'+t})
  .replace(/[{}]/g,'').replace(/ {2,}/g,' ');
 return r}
function md(t){
 let s=t.replace(/\$\$([\s\S]+?)\$\$/g,(_,x)=>'\n'+tex(x.trim())+'\n').replace(/\$([^$\n]+?)\$/g,(_,x)=>tex(x));
 s=esc(s).replace(/^#{1,4}\s*(.+)$/gm,'<b>$1</b>').replace(/\*\*([^*\n]+?)\*\*/g,'<b>$1</b>').replace(/^\s*[*\-]\s+/gm,'• ').replace(/\*([^*\n]+?)\*/g,'<i>$1</i>').replace(/\n{3,}/g,'\n\n');
 return s.trim()}

/* tanya schovi */
let chat=[],aiBusy=false;
try{localStorage.removeItem('schovival_key')}catch(e){}
const GK='schovival_gkey',GM='schovival_gmodel',GDEF='gemini-3.5-flash-lite';
const gKey=()=>{try{return localStorage.getItem(GK)||''}catch(e){return ''}};
const gModel=()=>{try{return localStorage.getItem(GM)||GDEF}catch(e){return GDEF}};
function vAI(){
 return `<h2>Tanya Schovi 🦉</h2><p class="muted">${gKey()?'Mode Gemini aktif: tanya apa saja. Kalau gagal, Schovi memakai catatan offline.':'Mode offline: Schovi menjawab dari catatan bawaan, tanpa internet. Ketik nama materi, atau soal hitungan seperti 12 x 5 + 3.'}</p>
 <div class="card"><div id="chat" class="chat"></div>
 <div class="row wrap" style="margin-top:10px">${['Hukum Newton','Tips belajar efektif untuk ujian','Beda inflasi dan deflasi','Rumus turunan','Tenses bahasa Inggris','Cara pakai pomodoro','Daftar topik'].map(q=>`<button class="chip" onclick="aiAsk(this.textContent)">${q}</button>`).join('')}</div>
 <div class="row" style="margin-top:10px"><input id="aq" placeholder="Ketik pertanyaanmu…" onkeydown="if(event.key==='Enter')aiAsk()"><button class="btn" onclick="aiAsk()">Kirim</button></div></div>
 <details class="card"><summary style="cursor:pointer;font-weight:700">⚙️ Opsional: aktifkan Gemini (API key gratis)</summary>
 <ol class="muted" style="margin:8px 0 8px 18px;line-height:1.7"><li>Buka aistudio.google.com lalu masuk dengan akun Google.</li><li>Pilih "Get API key", buat key, lalu salin.</li><li>Tempel di bawah, tekan Simpan.</li></ol>
 <p class="muted" style="margin-bottom:8px">Key hanya disimpan di browser perangkat ini dan dikirim langsung ke Google. Paket gratis punya batas pemakaian, dan Google dapat memakai percakapan di paket gratis untuk meningkatkan produknya, jadi jangan tulis data pribadi. Jangan bagikan file ini setelah mengisi key.</p>
 <label for="gk">API key Gemini</label><input id="gk" type="password" placeholder="AIza..." value="${esc(gKey())}" autocomplete="off">
 <label for="gm">Nama model</label><input id="gm" value="${esc(gModel())}" autocomplete="off">
 <div class="row" style="margin-top:10px"><button class="btn" onclick="saveG()">Simpan</button><button class="btn p" onclick="clearG()">Hapus key</button></div></details>`}
function saveG(){try{localStorage.setItem(GK,$('#gk').value.trim());localStorage.setItem(GM,$('#gm').value.trim()||GDEF);toast('Pengaturan tersimpan ✓');render()}catch(e){toast('Gagal menyimpan.')}}
function clearG(){try{localStorage.removeItem(GK)}catch(e){}toast('Key dihapus. Kembali ke mode offline.');render()}
function aiDraw(th){const c=$('#chat');if(!c)return;c.innerHTML=(chat.length?'':'<div class="msg a">Halo! Aku Schovi 🦉 Tanya soal pelajaran, ya. Ketik "daftar topik" untuk melihat apa saja yang kubisa.</div>')+chat.map(m=>`<div class="msg ${m.role==='user'?'u':'a'}">${m.role==='user'?esc(m.content):md(m.content)}</div>`).join('')+(th?'<div class="msg a">Schovi sedang mencari…</div>':'');c.scrollTop=c.scrollHeight}
function aiAsk(q){q=(q||$('#aq').value).trim();if(!q||aiBusy)return;gKey()?geminiAsk(q):localAsk(q)}
async function geminiAsk(q){
 chat.push({role:'user',content:q});$('#aq').value='';aiBusy=true;aiDraw(true);petSay('Hmm, kupikirkan dulu… 🤔','side');
 let h=chat.filter(m=>!m.err).slice(-12);while(h.length&&h[0].role!=='user')h.shift();
 const sys=`Kamu Schovi, burung hantu maskot aplikasi belajar Schovival, teman belajar siswa SMA Indonesia (nama ${S.user.name}, kelas ${S.user.kelas} ${S.user.jur}). Jawab dalam bahasa Indonesia yang ramah, singkat, dan mudah dipahami, dengan contoh. Bantu siswa memahami konsep, jangan hanya memberi jawaban jadi untuk PR. Jika tidak yakin, katakan dengan jujur. Jangan memakai LaTeX atau tanda dolar. Tulis rumus dengan teks biasa dan simbol Unicode, misalnya F = m × a; v² = v0² + 2as; B = (μ₀ × I) / (2π × a). Boleh memakai **tebal** dan daftar bernomor.`;
 try{
  const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(gModel())}:generateContent`,{method:'POST',headers:{'content-type':'application/json','x-goog-api-key':gKey()},body:JSON.stringify({systemInstruction:{parts:[{text:sys}]},contents:h.map(m=>({role:m.role==='user'?'user':'model',parts:[{text:m.content}]})),generationConfig:{maxOutputTokens:1500}})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok){const msg=(d.error&&d.error.message)||'';throw new Error(r.status===429?'Batas pemakaian gratis tercapai. Coba lagi nanti.':r.status===404?'Nama model tidak ditemukan. Cek nama model di Pengaturan.':(r.status===400||r.status===403)&&/key/i.test(msg)?'API key tidak valid. Cek lagi di Pengaturan.':msg||'Gagal terhubung ke Gemini.')}
  const t=((d.candidates||[])[0]?.content?.parts||[]).map(x=>x.text||'').join('').trim();
  if(!t)throw new Error('Gemini tidak memberi jawaban.');
  chat.push({role:'assistant',content:t});petSay('Jawabanku sudah siap! 🦉','wings')
 }catch(e){chat.push({role:'assistant',err:true,content:'⚠️ '+(e.message==='Failed to fetch'?'Tidak bisa terhubung. Cek internetmu.':e.message)+'\n\nJawaban dari catatan offline:\n'+localAnswer(q)})}
 aiBusy=false;if(view==='ai')aiDraw()}

const TALK=[['action','Ayo semangat! Satu langkah lagi ke puncak ✨'],['wings','Aku terbang bantu kamu belajar!'],['side','Psst, fokus ya, simpan dulu HP-nya 😉'],['back','Hehe, jangan lihat belakangku 🙈']];
let pbT,pose='front',pc=0;
function setPose(p){pose=p;$('#pi').src=POSES[p];if(p!=='front'){const i=$('#pi');i.style.setProperty('--dx','0px');i.style.setProperty('--dy','0px');i.style.setProperty('--rt','0deg')}}
function petSay(msg,p){const b=$('#pbub'),e=$('#pet');if(!b||e.classList.contains('hide'))return;if(p)setPose(p);b.textContent=msg;b.classList.add('on');clearTimeout(pbT);pbT=setTimeout(()=>{b.classList.remove('on');setPose('front')},4200);e.classList.remove('jump');void e.offsetWidth;e.classList.add('jump')}
function petClick(){const t=TALK[pc++%TALK.length];petSay(t[1],t[0])}
document.addEventListener('mousemove',e=>{const p=$('#pet');if(pose!=='front'||p.classList.contains('hide'))return;const r=p.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),d=Math.hypot(dx,dy)||1,k=Math.min(d,320)/320,i=$('#pi');i.style.setProperty('--dx',dx/d*6*k+'px');i.style.setProperty('--dy',dy/d*4*k+'px');i.style.setProperty('--rt',dx/d*5*k+'deg')});

function boot(){
 $('#lg').src=LOGO;$('#fm').src=POSES.front;setPose('front');
 if(!S.user){$('#onb').classList.remove('hide');$('#app').classList.add('hide');$('#pet').classList.add('hide');return}
 checkStreak();$('#onb').classList.add('hide');$('#app').classList.remove('hide');$('#pet').classList.remove('hide');$('#app').classList.toggle('col',!!S.col);view='home';render();
 setTimeout(()=>petSay('Halo '+S.user.name+'! Aku Schovi, temanmu belajar 🦉','action'),900)}
boot();
